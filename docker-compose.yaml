services: 
  database:
    image: mariadb:latest
    container_name: database_savv
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=savv
      - MYSQL_PASSWORD=savv123
      - MYSQL_DATABASE=database_savv
    ports:
      - "3306:3306"
    
  app:
    build: ./
    container_name: app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://savv:savv123@database:3306/database_savv
    depends_on:
      - database
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next